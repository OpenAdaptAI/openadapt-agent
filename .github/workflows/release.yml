name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: Exact reviewed version on protected main
        required: true
        type: string
      source_commit:
        description: Full protected-main commit SHA to tag
        required: true
        type: string
  push:
    tags: ["v*"]
  pull_request:
    paths:
      - "CHANGELOG.md"
      - "release-candidate.json"
      - "pyproject.toml"
      - "server.json"
      - "manifest.json"
      - ".mcpbignore"
      - "src/openadapt_agent/__init__.py"
      - "src/openadapt_agent/mcpb_entry.py"
      - "scripts/check_mcpb.py"
      - "scripts/check_release_artifacts.py"
      - "scripts/check_dist.py"
      - "scripts/check_source_boundary.py"
      - "scripts/validate_server_schema.py"
      - "scripts/verify_release_candidate.py"
      - "scripts/verify_release_registries.py"
      - "schemas/production-lifecycle-admission-candidate.schema.json"
      - "source-policy.public.json"
      - "tests/test_distribution.py"
      - "tests/test_release_registries.py"
      - ".github/workflows/release.yml"

concurrency:
  group: release-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  validate:
    name: Build + validate (dry run, no publish)
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.candidate.outputs.version }}
      tag: ${{ steps.candidate.outputs.tag }}
      source_commit: ${{ steps.candidate.outputs.source_commit }}
    steps:
      - name: Checkout the exact event source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Bind the event to the reviewed release candidate
        id: candidate
        shell: bash
        env:
          REQUESTED_VERSION: ${{ inputs.version }}
          REQUESTED_SOURCE_COMMIT: ${{ inputs.source_commit }}
        run: |
          set -euo pipefail
          source_commit="$(git rev-parse HEAD)"
          args=(
            --event-name "${GITHUB_EVENT_NAME}"
            --ref "${GITHUB_REF}"
            --source-commit "${source_commit}"
            --github-output "${GITHUB_OUTPUT}"
          )
          if [ "${GITHUB_EVENT_NAME}" = "workflow_dispatch" ]; then
            git fetch --no-tags origin \
              "+refs/heads/main:refs/remotes/origin/main"
            remote_main="$(git rev-parse refs/remotes/origin/main)"
            if [ "${source_commit}" != "${GITHUB_SHA}" ] || \
               [ "${source_commit}" != "${remote_main}" ]; then
              echo "::error::The manual release source is not exact current main." >&2
              exit 1
            fi
            args+=(
              --requested-version "${REQUESTED_VERSION}"
              --requested-source-commit "${REQUESTED_SOURCE_COMMIT}"
            )
          elif [ "${GITHUB_EVENT_NAME}" = "push" ]; then
            if [ "$(git cat-file -t "${GITHUB_REF}")" != "tag" ]; then
              echo "::error::A release tag must be annotated." >&2
              exit 1
            fi
            if [ "$(git rev-parse "${GITHUB_REF}^{commit}")" != "${source_commit}" ]; then
              echo "::error::The release tag does not resolve to the checked-out commit." >&2
              exit 1
            fi
          fi
          python scripts/verify_release_candidate.py "${args[@]}"
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "20"
      - name: Install tooling
        run: |
          python -m pip install --upgrade pip
          python -m pip install --upgrade build "twine>=6.1" "packaging>=24.2" jsonschema
          python -m pip install -e ".[dev]"
      - name: Run release contract tests
        run: python -m pytest tests/test_distribution.py tests/test_release_registries.py -q
      - name: Build sdist and wheel
        run: python -m build
      - name: Check the exact release archives
        run: |
          python scripts/check_release_artifacts.py dist
          python scripts/check_dist.py dist/*
          python scripts/check_source_boundary.py --require-dist
      - name: Check the package metadata
        run: twine check dist/*
      - name: Validate and pack the local MCPB
        shell: bash
        run: |
          set -euo pipefail
          version="${{ steps.candidate.outputs.version }}"
          mkdir -p mcpb-dist
          npx -y @anthropic-ai/mcpb@2.1.2 validate manifest.json
          npx -y @anthropic-ai/mcpb@2.1.2 pack . "mcpb-dist/openadapt-agent-${version}.mcpb"
          python scripts/check_mcpb.py mcpb-dist/*.mcpb
      - name: Validate server.json against the pinned MCP registry schema
        run: python scripts/validate_server_schema.py --server-json server.json
      - name: Upload the checked Python distributions
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dist-${{ steps.candidate.outputs.version }}-${{ steps.candidate.outputs.source_commit }}
          path: dist/
          if-no-files-found: error
          retention-days: 1
      - name: Upload the checked local MCPB
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: mcpb-${{ steps.candidate.outputs.version }}-${{ steps.candidate.outputs.source_commit }}
          path: mcpb-dist/
          if-no-files-found: error
          retention-days: 1

  create-release-tag:
    name: Create the reviewed annotated tag
    needs: validate
    if: ${{ github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    environment: release-identity
    permissions:
      contents: read
    steps:
      - name: Checkout protected main without stored credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.validate.outputs.source_commit }}
          fetch-depth: 0
          persist-credentials: false
      - name: Revalidate current main and the requested candidate
        id: existing
        shell: bash
        env:
          EXPECTED_SOURCE_COMMIT: ${{ needs.validate.outputs.source_commit }}
          EXPECTED_TAG: ${{ needs.validate.outputs.tag }}
          EXPECTED_VERSION: ${{ needs.validate.outputs.version }}
        run: |
          set -euo pipefail
          if [ "${GITHUB_EVENT_NAME}" != "workflow_dispatch" ] || \
             [ "${GITHUB_REF}" != "refs/heads/main" ] || \
             [ "${GITHUB_SHA}" != "${EXPECTED_SOURCE_COMMIT}" ]; then
            echo "::error::Tag creation requires the reviewed workflow_dispatch on exact main." >&2
            exit 1
          fi
          git fetch --no-tags origin \
            "+refs/heads/main:refs/remotes/origin/main"
          remote_main="$(git rev-parse refs/remotes/origin/main)"
          if [ "${remote_main}" != "${EXPECTED_SOURCE_COMMIT}" ] || \
             [ "$(git rev-parse HEAD)" != "${EXPECTED_SOURCE_COMMIT}" ]; then
            echo "::error::Main advanced after review. Dispatch the new exact candidate." >&2
            exit 1
          fi
          python scripts/verify_release_candidate.py \
            --event-name workflow_dispatch \
            --ref refs/heads/main \
            --source-commit "${EXPECTED_SOURCE_COMMIT}" \
            --requested-version "${EXPECTED_VERSION}" \
            --requested-source-commit "${EXPECTED_SOURCE_COMMIT}"
          if git ls-remote --exit-code --tags origin \
             "refs/tags/${EXPECTED_TAG}" >/dev/null 2>&1; then
            git fetch --force origin \
              "refs/tags/${EXPECTED_TAG}:refs/tags/${EXPECTED_TAG}"
            if [ "$(git cat-file -t "refs/tags/${EXPECTED_TAG}")" != "tag" ] || \
               [ "$(git rev-parse "refs/tags/${EXPECTED_TAG}^{commit}")" != \
                 "${EXPECTED_SOURCE_COMMIT}" ]; then
              echo "::error::The release tag exists with a different identity." >&2
              exit 1
            fi
            echo "exists=true" >> "${GITHUB_OUTPUT}"
            echo "The exact annotated release tag already exists. No ref changed."
          else
            echo "exists=false" >> "${GITHUB_OUTPUT}"
          fi
      - name: Mint the release App token
        if: ${{ steps.existing.outputs.exists != 'true' }}
        id: release-app
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ vars.OPENADAPT_RELEASE_APP_ID }}
          private-key: ${{ secrets.OPENADAPT_RELEASE_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: openadapt-agent
          permission-contents: write
      - name: Create and push only the annotated release tag
        if: ${{ steps.existing.outputs.exists != 'true' }}
        shell: bash
        env:
          RELEASE_APP_TOKEN: ${{ steps.release-app.outputs.token }}
          EXPECTED_SOURCE_COMMIT: ${{ needs.validate.outputs.source_commit }}
          RELEASE_TAG: ${{ needs.validate.outputs.tag }}
          RELEASE_VERSION: ${{ needs.validate.outputs.version }}
        run: |
          set -euo pipefail
          if git ls-remote --exit-code --tags origin \
             "refs/tags/${RELEASE_TAG}" >/dev/null 2>&1; then
            echo "::error::The release tag appeared after validation. Refusing the race." >&2
            exit 1
          fi
          git config user.name "OpenAdapt Release App"
          git config user.email "openadapt-release[bot]@users.noreply.github.com"
          git tag -a "${RELEASE_TAG}" "${EXPECTED_SOURCE_COMMIT}" \
            -m "openadapt-agent ${RELEASE_VERSION}"
          auth="$(printf 'x-access-token:%s' "${RELEASE_APP_TOKEN}" | base64 | tr -d '\n')"
          export GIT_CONFIG_COUNT=1
          export GIT_CONFIG_KEY_0=http.https://github.com/.extraheader
          export GIT_CONFIG_VALUE_0="AUTHORIZATION: basic ${auth}"
          git push origin "refs/tags/${RELEASE_TAG}:refs/tags/${RELEASE_TAG}"

  pypi-publish:
    name: Publish to PyPI
    needs: validate
    if: ${{ github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v') }}
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout the exact release tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.ref }}
          persist-credentials: false
      - name: Download the checked Python distributions
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dist-${{ needs.validate.outputs.version }}-${{ needs.validate.outputs.source_commit }}
          path: dist/
      - name: Recheck the exact archives before publication
        run: |
          python scripts/check_release_artifacts.py dist
          python scripts/check_source_boundary.py --require-dist
      - name: Publish with PyPI Trusted Publishing
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        with:
          print-hash: true

  mcp-registry-publish:
    name: Publish server.json to the MCP registry
    needs: [validate, pypi-publish]
    if: ${{ github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v') }}
    runs-on: ubuntu-latest
    environment: mcp-registry
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout the exact release tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.ref }}
          persist-credentials: false
      - name: Wait for the exact PyPI package
        shell: bash
        env:
          RELEASE_VERSION: ${{ needs.validate.outputs.version }}
        run: |
          set -euo pipefail
          url="https://pypi.org/pypi/openadapt-agent/${RELEASE_VERSION}/json"
          for attempt in $(seq 1 20); do
            code="$(curl --silent --output /dev/null --write-out '%{http_code}' "${url}")"
            if [ "${code}" = "200" ]; then
              exit 0
            fi
            echo "Attempt ${attempt}: PyPI returned ${code}; waiting 15 seconds."
            sleep 15
          done
          echo "::error::The exact Agent release did not appear on PyPI." >&2
          exit 1
      - name: Install the pinned MCP registry publisher
        shell: bash
        run: |
          set -euo pipefail
          publisher_version="1.8.1"
          archive="mcp-publisher_linux_amd64.tar.gz"
          expected_sha256="a06c9096dcb9727c13555b6be26c7effa707b01f06a4c561ba7a3635443cf2cc"
          curl --fail --location --retry 3 --retry-delay 2 \
            --output "${archive}" \
            "https://github.com/modelcontextprotocol/registry/releases/download/v${publisher_version}/${archive}"
          printf '%s  %s\n' "${expected_sha256}" "${archive}" | sha256sum --check --strict
          tar xzf "${archive}" mcp-publisher
          ./mcp-publisher --version
      - name: Authenticate with GitHub OIDC
        run: ./mcp-publisher login github-oidc
      - name: Publish the exact server descriptor
        run: ./mcp-publisher publish

  registry-parity:
    name: Verify registries and retain the admission input
    needs: [validate, pypi-publish, mcp-registry-publish]
    if: ${{ github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v') }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout the exact release tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.ref }}
          persist-credentials: false
      - name: Download the exact published Python distributions
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dist-${{ needs.validate.outputs.version }}-${{ needs.validate.outputs.source_commit }}
          path: dist/
      - name: Checkout the canonical lifecycle policy
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: OpenAdaptAI/.github
          ref: main
          path: .production-lifecycle
          persist-credentials: false
      - name: Verify registry parity and write the unadmitted candidate
        shell: bash
        env:
          RELEASE_TAG: ${{ needs.validate.outputs.tag }}
          RELEASE_VERSION: ${{ needs.validate.outputs.version }}
          SOURCE_COMMIT: ${{ needs.validate.outputs.source_commit }}
        run: |
          set -euo pipefail
          lifecycle_commit="$(git -C .production-lifecycle rev-parse HEAD)"
          python scripts/verify_release_registries.py \
            --dist dist \
            --server-json server.json \
            --version "${RELEASE_VERSION}" \
            --tag "${RELEASE_TAG}" \
            --source-commit "${SOURCE_COMMIT}" \
            --lifecycle-policy .production-lifecycle/production-lifecycle-policy.json \
            --lifecycle-source-commit "${lifecycle_commit}" \
            --output release-metadata/production-admission-candidate.json \
            --attempts 20 \
            --retry-seconds 15
          sha256sum release-metadata/production-admission-candidate.json
      - name: Upload the bounded admission-candidate handoff
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: production-admission-candidate-${{ needs.validate.outputs.version }}
          path: release-metadata/production-admission-candidate.json
          if-no-files-found: error
          retention-days: 30
